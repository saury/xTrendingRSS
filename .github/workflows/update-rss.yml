name: Update X Trending RSS Feed

on:
  schedule:
    # Run daily at 00:00 UTC (8:00 AM Beijing time)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for git push

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Install bird CLI
      run: |
        npm install
        
    - name: Fetch trending topics and generate RSS
      env:
        TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}  # Optional: AI enhancement
      run: |
        python fetch_trending.py
        
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add trending.xml trending_history.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update trending topics - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && git push)
